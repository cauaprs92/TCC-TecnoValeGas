<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produtos Obra Grande</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 7.5pt;
      color: #000;
      background: #525659;
    }

    /* ── Barra de ações (não sai na impressão) ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 10px;
      background: #323639;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
    .toolbar button {
      padding: 8px 18px;
      border: none;
      border-radius: 4px;
      font-size: 10pt;
      cursor: pointer;
      background: #f26522;
      color: #fff;
    }
    .toolbar button.sec { background: #666; }

    /* ── Folha A4 ── */
    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 16px auto;
      padding: 8mm 10mm;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.5);
    }

    @page { size: A4; margin: 0; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .page {
        width: auto;
        min-height: auto;
        margin: 0;
        box-shadow: none;
      }
    }

    /* dados preenchidos pela API */
    [id^="f-"] {
      font-weight: bold;
      text-transform: uppercase;
    }

    /* ── Cabeçalho ── */
    .cabecalho {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3mm;
    }
    .cabecalho h1 { font-size: 12pt; }
    .cabecalho .esq div { margin-top: 3mm; font-weight: bold; font-size: 9.5pt; }
    .cabecalho .dir { text-align: right; }
    .cabecalho .dir img { height: 11mm; display: block; margin-left: auto; margin-bottom: 1.5mm; }
    .cabecalho .dir .data { font-size: 9.5pt; margin-bottom: 1.5mm; }
    .cabecalho .dir .unidade { color: #808080; font-weight: bold; }
    .cabecalho .dir .unidade b { color: #000; }

    /* ── Duas colunas independentes de tabelas ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 3mm;
      align-items: start;
    }
    .coluna {
      display: flex;
      flex-direction: column;
      gap: 2.5mm;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    td, th {
      border: 1px solid #000;
      padding: 0.3mm 1.2mm;
      overflow: hidden;
      white-space: nowrap;
      height: 3.8mm;
      line-height: 1;
    }
    col.c-cod  { width: 16%; }
    col.c-item { width: 58%; }
    col.c-uso  { width: 26%; }

    th {
      background: #d9d9d9;
      text-align: center;
      font-size: 7pt;
    }
    th.secao { font-size: 8.5pt; }
    td.item, td.cod { font-weight: bold; }
  </style>
</head>
<body>

    <button onclick="window.print()">🖨 Imprimir / Salvar PDF</button>
    <button class="sec" onclick="window.close()">Fechar</button>

    </div>

    <div class="grid">

    function montarTabela(sec) {
      const tabela = document.createElement('table');
      let html = '<colgroup><col class="c-cod"><col class="c-item"><col class="c-uso"></colgroup>';

      html += `<tr><th class="secao" colspan="3">${sec.titulo}</th></tr>`;
      html += '<tr><th>CÓDIGO</th><th>ITEM</th><th>UTILIZ.OBRA</th></tr>';

      for (const [cod, item] of sec.itens) {
        html += `<tr><td class="cod">${cod}</td><td class="item">${item}</td><td></td></tr>`;
      }
      for (let i = 0; i < sec.vazias; i++) {
        html += '<tr><td>&nbsp;</td><td></td><td></td></tr>';
      }

      tabela.innerHTML = html;
      return tabela;
    }

    // Seções em índice par vão para a coluna esquerda; ímpar, direita
    const colEsq = document.getElementById('col-esq');
    const colDir = document.getElementById('col-dir');
    SECOES.forEach((sec, i) => (i % 2 === 0 ? colEsq : colDir).appendChild(montarTabela(sec)));

    function _txt(id, valor) {
      if (valor !== null && valor !== undefined && valor !== '') {
        document.getElementById(id).textContent = valor;
      }
    }

    async function _api(endpoint, token) {
      const res = await fetch(endpoint, { headers: { 'Authorization': `Bearer ${token}` } });
      if (!res.ok) throw new Error(`Erro ${res.status} em ${endpoint}`);
      return res.json();
    }

    async function carregar() {
      const token  = sessionStorage.getItem('token');
      const idObra = new URLSearchParams(location.search).get('id');

      if (!token)  { document.body.innerHTML = '<p style="color:#fff;padding:20px">Sessão expirada. Faça login novamente.</p>'; return; }
      if (!idObra) { document.body.innerHTML = '<p style="color:#fff;padding:20px">Obra não informada.</p>'; return; }

      try {
        const { obra } = await _api(`/obra/${idObra}`, token);
        document.title = `Produtos Obra Grande ${obra.idObra}`;

        if (obra.codCliente) {
          const { cliente } = await _api(`/cliente/${obra.codCliente}`, token);
          _txt('f-cliente', cliente.nomeCliente);
          _txt('f-cidade',  cliente.cidade);
        }
      } catch (e) {
        alert('Erro ao carregar os dados da obra: ' + e.message);
      }
    }

    carregar();
